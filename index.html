            function loadLinks() {

                let showPrivate = false;

                // If url has #all, show to private ones in addition to the public 
                let url = location.href;
                if (url.indexOf("#") != -1)
                    if (url.split('#')[1] == "all")
                        showPrivate = true;

                // Filter links if needed
                let linksToShow = allLinks;
                if (!showPrivate) {
                    linksToShow = allLinks.filter(link => link.type == "Public");
                }

                var linkLIs = "";
                linksToShow.forEach(function(link, linkId) { 
                    linkLIs += linkMarkup(link, linkId);
                });
                
                document.getElementById('links').innerHTML = `<div class="flex-container">${linkLIs}</div>`;
            }


            function linkHover(code, over) {
                const duration = 200;

                d3.selectAll(".date" + code)
                    .transition()
                    .duration(duration)
                    .style("color", over ? "#404040" : "darkgrey")

                d3.selectAll(".title" + code)
                    .transition(200)
                    .duration(duration)
                    .style("background-color", over ? "gainsboro" : "white")

                d3.selectAll(".link" + code)
                    .transition()
                    .duration(duration)
                    .style("background-color", over ? "gainsboro" : "white")
            }

            function linkMarkup(link, linkId) {
                return `
                    <div class="link link${linkId}" onclick="window.open('${link.url}','mywindow');" onmouseover="linkHover('${linkId}', true)" onmouseout="linkHover('${linkId}', false)" style="cursor: pointer;">
                        <div class="link-header">
                            <p class="date date${linkId}">${link.when}</p>
                            <h2 class="link-title title${linkId}">${link.title}</h2>
                            <p>${link.description}</p>
                            <p class="date date${linkId}">${link.tech}</p>
                        </div>   
                        <img class="screen" src="${link.image}" alt="" height="250" width="375">
                    </div>
                `;
            }
